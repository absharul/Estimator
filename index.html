<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeper Business Profit Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #fafbfc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #fff;
        }

        input.invalid {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 140px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .export-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .export-btn:hover {
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8ff 100%);
            border-radius: 12px;
            border-left: 4px solid #4CAF50;
        }

        .result h3 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 5px;
        }

        .table-container {
            overflow-x: auto;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #e1e5e9;
            font-size: 0.9rem;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #f8f9ff;
        }

        .highlight-row {
            background-color: #fff3cd !important;
            font-weight: 600;
        }

        .highlight-row:hover {
            background-color: #fff3cd !important;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px;
                margin: 5px auto;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            input {
                padding: 14px 15px;
                font-size: 16px;
                /* Prevents zoom on iOS */
            }

            .button-group {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
                padding: 14px 20px;
                font-size: 16px;
            }

            th,
            td {
                padding: 8px 10px;
                font-size: 0.85rem;
            }

            th {
                font-size: 0.75rem;
            }

            .result {
                padding: 15px;
            }

            .result h3 {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
                margin: 2px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.3rem;
            }

            input {
                padding: 12px;
            }

            button {
                padding: 12px 16px;
            }

            th,
            td {
                padding: 6px 8px;
                font-size: 0.8rem;
            }

            .result {
                padding: 12px;
            }

            .result h3 {
                font-size: 1rem;
                margin-bottom: 10px;
            }
        }

        /* Landscape mode adjustments for small screens */
        @media (max-width: 768px) and (orientation: landscape) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Loading animation for buttons */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                color: rgba(0, 0, 0, 0);
                text-shadow: 0.25em 0 0 rgba(0, 0, 0, 0), 0.5em 0 0 rgba(0, 0, 0, 0);
            }

            40% {
                color: white;
                text-shadow: 0.25em 0 0 rgba(0, 0, 0, 0), 0.5em 0 0 rgba(0, 0, 0, 0);
            }

            60% {
                text-shadow: 0.25em 0 0 white, 0.5em 0 0 rgba(0, 0, 0, 0);
            }

            80%,
            100% {
                text-shadow: 0.25em 0 0 white, 0.5em 0 0 white;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💰 Business Tool</h1>

        <div style="margin-bottom: 20px; text-align: center;">
            <label style="font-weight: 600; color: #555;">
                <input type="checkbox" id="autoCalcToggle" onchange="toggleAutoCalc()"> Auto-Calculate on Input Change
            </label>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Auction Price per Sleeper (₹)</label>
                <input type="number" id="auctionPrice" value="" step="0.01"
                    title="The price paid to acquire each sleeper at auction">
            </div>

            <div class="form-group">
                <label>Quantity (No. of Sleepers)</label>
                <input type="number" id="quantity" value="" step="1" title="Total number of sleepers being processed">
            </div>

            <div class="form-group">
                <label>GST %</label>
                <input type="number" id="gst" value="18" step="0.01"
                    title="GST rate applied to purchases (default 18%)">
            </div>

            <div class="form-group">
                <label>Transportation Cost per Sleeper (₹)</label>
                <input type="number" id="transport" value="" step="0.01" title="Cost to transport each sleeper">
            </div>

            <div class="form-group">
                <label>Labour Cost per Sleeper (₹)</label>
                <input type="number" id="labour" value="60" step="0.01"
                    title="Labour cost for processing each sleeper (default ₹60)">
            </div>

            <div class="form-group">
                <label>Land Lease Cost per Sleeper (₹)</label>
                <input type="number" id="landLease" value="" step="0.01" title="Lease cost for land used per sleeper">
            </div>

            <div class="form-group">
                <label>Other Fixed Expenses (₹)</label>
                <input type="number" id="others" value="" step="0.01" title="Any additional fixed expenses">
            </div>

            <!-- Steel Wire Section -->
            <div class="form-group"
                style="grid-column: 1 / -1; background: linear-gradient(135deg, #e3f2fd 0%, #f5f5f5 100%); padding: 15px; border-radius: 10px; margin-top: 10px;">
                <h4 style="color: #1565c0; margin-bottom: 10px; font-size: 1rem;">🔩 Steel Wire</h4>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                    <div class="form-group">
                        <label>Weight per Sleeper (kg)</label>
                        <input type="number" id="steelWireWeight" value="7" step="0.01"
                            title="Kilograms of steel wire extracted from each sleeper">
                    </div>
                    <div class="form-group">
                        <label>Selling Price per kg (₹)</label>
                        <input type="number" id="steelWirePrice" value="44" step="0.01"
                            title="Selling price per kg of steel wire">
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; padding-top: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="steelWireGST" checked
                                style="width: auto; transform: scale(1.3);">
                            Apply 18% GST
                        </label>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; padding-top: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="steelWirePriceIncludesGST"
                                style="width: auto; transform: scale(1.3);">
                            Price includes GST
                        </label>
                    </div>
                </div>
            </div>

            <!-- MS Scrap Section -->
            <div class="form-group"
                style="grid-column: 1 / -1; background: linear-gradient(135deg, #fff3e0 0%, #f5f5f5 100%); padding: 15px; border-radius: 10px;">
                <h4 style="color: #e65100; margin-bottom: 10px; font-size: 1rem;">🗑️ MS Scrap</h4>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                    <div class="form-group">
                        <label>Weight per Sleeper (kg)</label>
                        <input type="number" id="msScrapWeight" value="7" step="0.01"
                            title="Kilograms of MS scrap extracted from each sleeper">
                    </div>
                    <div class="form-group">
                        <label>Selling Price per kg (₹)</label>
                        <input type="number" id="msScrapPrice" value="38" step="0.01"
                            title="Selling price per kg of MS scrap">
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; padding-top: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="msScrapGST" style="width: auto; transform: scale(1.3);">
                            Apply 18% GST
                        </label>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; padding-top: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="msScrapPriceIncludesGST"
                                style="width: auto; transform: scale(1.3);">
                            Price includes GST
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="calculateProfit()" id="calcBtn">📊 Calculate</button>
            <button onclick="resetInputs()">🔄 Reset</button>
            <button onclick="saveConfig()">💾 Save Config</button>
            <button onclick="loadConfig()">📂 Load Config</button>
            <button onclick="exportExcel()" class="export-btn">📄 Export Excel</button>
            <button onclick="exportPDF()" class="export-btn">📋 Export PDF</button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        function formatNumber(num) { return num.toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
        let lastCalculation = {};

        function resetInputs() {
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                if (input.id === 'gst') input.value = '18';
                else if (input.id === 'labour') input.value = '60';
                else if (input.id === 'steelWireWeight') input.value = '7';
                else if (input.id === 'steelWirePrice') input.value = '44';
                else if (input.id === 'msScrapWeight') input.value = '7';
                else if (input.id === 'msScrapPrice') input.value = '38';
                else input.value = '';
                input.classList.remove('invalid');
            });
            // Reset checkboxes
            document.getElementById('steelWireGST').checked = true;
            document.getElementById('msScrapGST').checked = false;
            document.getElementById('steelWirePriceIncludesGST').checked = false;
            document.getElementById('msScrapPriceIncludesGST').checked = false;
            document.getElementById('result').innerHTML = '';
            lastCalculation = {};
        }

        function saveConfig() {
            const config = {};
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                config[input.id] = input.value;
            });
            // Save checkbox states
            config['steelWireGST'] = document.getElementById('steelWireGST').checked;
            config['msScrapGST'] = document.getElementById('msScrapGST').checked;
            config['steelWirePriceIncludesGST'] = document.getElementById('steelWirePriceIncludesGST').checked;
            config['msScrapPriceIncludesGST'] = document.getElementById('msScrapPriceIncludesGST').checked;
            localStorage.setItem('sleeperProfitConfig', JSON.stringify(config));
            alert('Configuration saved!');
        }

        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('sleeperProfitConfig'));
            if (config) {
                Object.keys(config).forEach(id => {
                    const input = document.getElementById(id);
                    if (input) {
                        if (input.type === 'checkbox') {
                            input.checked = config[id];
                        } else {
                            input.value = config[id];
                        }
                    }
                });
                alert('Configuration loaded!');
            } else {
                alert('No saved configuration found.');
            }
        }

        function validateInputs() {
            const inputs = document.querySelectorAll('input[type="number"]');
            let isValid = true;
            inputs.forEach(input => {
                const value = parseFloat(input.value) || 0;
                if (input.id === 'quantity' || input.id === 'auctionPrice') {
                    if (value <= 0) {
                        input.classList.add('invalid');
                        isValid = false;
                    } else {
                        input.classList.remove('invalid');
                    }
                } else if (value < 0) {
                    input.classList.add('invalid');
                    isValid = false;
                } else {
                    input.classList.remove('invalid');
                }
            });
            return isValid;
        }

        function calculateProfit() {
            const calcBtn = document.getElementById('calcBtn');
            calcBtn.classList.add('loading');
            calcBtn.textContent = 'Calculating';

            setTimeout(() => {
                if (!validateInputs()) {
                    alert('Please enter valid positive values for required fields (Auction Price and Quantity must be greater than 0)');
                    calcBtn.classList.remove('loading');
                    calcBtn.textContent = '📊 Calculate';
                    return;
                }

                let auctionPrice = parseFloat(document.getElementById('auctionPrice').value) || 0;
                let qty = parseFloat(document.getElementById('quantity').value) || 0;
                let gstRate = parseFloat(document.getElementById('gst').value) / 100 || 0;
                let labour = parseFloat(document.getElementById('labour').value) || 0;
                let transportPerSleeper = parseFloat(document.getElementById('transport').value) || 0;
                let landLeasePerSleeper = parseFloat(document.getElementById('landLease').value) || 0;
                let transport = transportPerSleeper * qty;
                let landLease = landLeasePerSleeper * qty;
                let others = parseFloat(document.getElementById('others').value) || 0;

                // Steel Wire
                let steelWireWeight = parseFloat(document.getElementById('steelWireWeight').value) || 0;
                let steelWirePriceInput = parseFloat(document.getElementById('steelWirePrice').value) || 0;
                let steelWireGSTEnabled = document.getElementById('steelWireGST').checked;
                let steelWirePriceIncludesGST = document.getElementById('steelWirePriceIncludesGST').checked;

                // MS Scrap
                let msScrapWeight = parseFloat(document.getElementById('msScrapWeight').value) || 0;
                let msScrapPriceInput = parseFloat(document.getElementById('msScrapPrice').value) || 0;
                let msScrapGSTEnabled = document.getElementById('msScrapGST').checked;
                let msScrapPriceIncludesGST = document.getElementById('msScrapPriceIncludesGST').checked;

                // Cost calculations
                let purchaseBase = auctionPrice * qty;
                let inputGST = purchaseBase * gstRate;
                let labourCost = labour * qty;
                let totalCostsExclGST = purchaseBase + labourCost + transport + landLease + others;
                let perSleeperCost = totalCostsExclGST / qty;

                // Steel Wire Revenue
                // If price includes GST: GST = price * gstRate, base = price - GST
                // Example: Rs.44 with 18% GST -> GST = 7.92, base = 36.08
                let totalSteelWireWeight = steelWireWeight * qty;
                let steelWirePrice = steelWirePriceIncludesGST ? steelWirePriceInput * (1 - gstRate) : steelWirePriceInput;
                let steelWireRevenueBase = steelWirePrice * totalSteelWireWeight;
                let steelWireRevenueGST = 0;
                if (steelWirePriceIncludesGST) {
                    // GST is already included in price: GST = price * 18%
                    steelWireRevenueGST = steelWirePriceInput * gstRate * totalSteelWireWeight;
                } else if (steelWireGSTEnabled) {
                    // Add GST on top of base price
                    steelWireRevenueGST = steelWireRevenueBase * gstRate;
                }
                let steelWireGSTLabel = (steelWirePriceIncludesGST || steelWireGSTEnabled) ? "Yes" : "No";

                // MS Scrap Revenue
                // Same logic for MS Scrap
                let totalMsScrapWeight = msScrapWeight * qty;
                let msScrapPrice = msScrapPriceIncludesGST ? msScrapPriceInput * (1 - gstRate) : msScrapPriceInput;
                let msScrapRevenueBase = msScrapPrice * totalMsScrapWeight;
                let msScrapRevenueGST = 0;
                if (msScrapPriceIncludesGST) {
                    // GST is already included in price: GST = price * 18%
                    msScrapRevenueGST = msScrapPriceInput * gstRate * totalMsScrapWeight;
                } else if (msScrapGSTEnabled) {
                    // Add GST on top of base price
                    msScrapRevenueGST = msScrapRevenueBase * gstRate;
                }
                let msScrapGSTLabel = (msScrapPriceIncludesGST || msScrapGSTEnabled) ? "Yes" : "No";

                // Combined Revenue
                let totalRevenueBase = steelWireRevenueBase + msScrapRevenueBase;
                let totalRevenueGST = steelWireRevenueGST + msScrapRevenueGST;
                let totalRevenue = totalRevenueBase + totalRevenueGST;

                // Profit Calculations
                let grossProfit = totalRevenueBase - totalCostsExclGST;
                let profitMarginPercent = totalRevenueBase > 0 ? (grossProfit / totalRevenueBase) * 100 : 0;

                // GST Impact on profit:
                // - If selling with GST: Input GST is recoverable via ITC, so no impact on profit
                // - If NOT selling with GST: Input GST cannot be claimed, it becomes a cost
                let isSellingWithGST = steelWireGSTEnabled || msScrapGSTEnabled || steelWirePriceIncludesGST || msScrapPriceIncludesGST;
                let unclaimableInputGST = isSellingWithGST ? 0 : inputGST;
                let netProfit = grossProfit - unclaimableInputGST;

                // Net GST Payable (info only - this is paid to govt, not from your profit)
                let netGSTPayable = totalRevenueGST - inputGST;

                let grossProfitPerSleeper = grossProfit / qty;
                let netProfitPerSleeper = netProfit / qty;

                lastCalculation = {
                    purchaseBase, labourCost, transport, landLease, others, totalCostsExclGST, perSleeperCost,
                    totalSteelWireWeight, steelWirePrice, steelWirePriceInput, steelWireRevenueBase, steelWireRevenueGST, steelWireGSTEnabled, steelWirePriceIncludesGST,
                    totalMsScrapWeight, msScrapPrice, msScrapPriceInput, msScrapRevenueBase, msScrapRevenueGST, msScrapGSTEnabled, msScrapPriceIncludesGST,
                    totalRevenueBase, totalRevenueGST, totalRevenue,
                    grossProfit, netProfit, grossProfitPerSleeper, netProfitPerSleeper, profitMarginPercent,
                    inputGST, netGSTPayable, unclaimableInputGST, isSellingWithGST, qty
                };

                document.getElementById('result').innerHTML = `
    <h3>💵 Cost Breakdown</h3>
    <div class="table-container">
   <table>
    <tr><th>Item</th><th>Total (₹)</th><th>Per Sleeper (₹)</th></tr>
    <tr><td>Purchase Base</td><td>₹${formatNumber(purchaseBase)}</td><td>₹${formatNumber(auctionPrice)}</td></tr>
    <tr><td>Purchase GST (Input Tax)</td><td>₹${formatNumber(inputGST)}</td><td>₹${formatNumber(inputGST / qty)}</td></tr>
    <tr><td>Labour Cost</td><td>₹${formatNumber(labourCost)}</td><td>₹${formatNumber(labour)}</td></tr>
    <tr><td>Transportation</td><td>₹${formatNumber(transport)}</td><td>₹${formatNumber(transportPerSleeper)}</td></tr>
    <tr><td>Land Lease</td><td>₹${formatNumber(landLease)}</td><td>₹${formatNumber(landLeasePerSleeper)}</td></tr>
    <tr><td>Other Fixed Expenses</td><td>₹${formatNumber(others)}</td><td>₹${formatNumber(others / qty)}</td></tr>
    <tr class="highlight-row"><td><b>Total Cost (incl. GST)</b></td><td><b>₹${formatNumber(totalCostsExclGST + inputGST)}</b></td><td><b>₹${formatNumber((totalCostsExclGST + inputGST) / qty)}</b></td></tr>
    </table>
    </div>

    <h3>🔩 Steel Wire Revenue</h3>
    <div class="table-container">
    <table>
    <tr><th>Item</th><th>Total</th><th>Per kg (₹)</th></tr>
    <tr><td>Total Weight Extracted</td><td>${formatNumber(totalSteelWireWeight)} kg</td><td>-</td></tr>
    ${steelWirePriceIncludesGST ? `<tr><td>Entered Price (GST Inclusive)</td><td>-</td><td>₹${formatNumber(steelWirePriceInput)}</td></tr>` : ''}
    <tr><td>Base Price Revenue</td><td>₹${formatNumber(steelWireRevenueBase)}</td><td>₹${formatNumber(steelWirePrice)}</td></tr>
    <tr><td>GST ${steelWirePriceIncludesGST ? 'Included' : 'Applied'} (18%)</td><td style="color: ${(steelWireGSTEnabled || steelWirePriceIncludesGST) ? '#2e7d32' : '#666'};">${steelWireGSTLabel} ${(steelWireGSTEnabled || steelWirePriceIncludesGST) ? '- ₹' + formatNumber(steelWireRevenueGST) : ''}</td><td>${steelWirePriceIncludesGST ? '₹' + formatNumber(steelWirePriceInput - steelWirePrice) : '-'}</td></tr>
    <tr class="highlight-row"><td><b>Total Steel Wire Revenue</b></td><td><b>₹${formatNumber(steelWireRevenueBase + steelWireRevenueGST)}</b></td><td>-</td></tr>
    </table>
    </div>

    <h3>🗑️ MS Scrap Revenue</h3>
    <div class="table-container">
    <table>
    <tr><th>Item</th><th>Total</th><th>Per kg (₹)</th></tr>
    <tr><td>Total Weight Extracted</td><td>${formatNumber(totalMsScrapWeight)} kg</td><td>-</td></tr>
    ${msScrapPriceIncludesGST ? `<tr><td>Entered Price (GST Inclusive)</td><td>-</td><td>₹${formatNumber(msScrapPriceInput)}</td></tr>` : ''}
    <tr><td>Base Price Revenue</td><td>₹${formatNumber(msScrapRevenueBase)}</td><td>₹${formatNumber(msScrapPrice)}</td></tr>
    <tr><td>GST ${msScrapPriceIncludesGST ? 'Included' : 'Applied'} (18%)</td><td style="color: ${(msScrapGSTEnabled || msScrapPriceIncludesGST) ? '#e65100' : '#666'};">${msScrapGSTLabel} ${(msScrapGSTEnabled || msScrapPriceIncludesGST) ? '- ₹' + formatNumber(msScrapRevenueGST) : ''}</td><td>${msScrapPriceIncludesGST ? '₹' + formatNumber(msScrapPriceInput - msScrapPrice) : '-'}</td></tr>
    <tr class="highlight-row"><td><b>Total MS Scrap Revenue</b></td><td><b>₹${formatNumber(msScrapRevenueBase + msScrapRevenueGST)}</b></td><td>-</td></tr>
    </table>
    </div>

    <h3>📈 Profit & GST Summary</h3>
    <div class="table-container">
    <table>
    <tr><td>Total Revenue (Base)</td><td>₹${formatNumber(totalRevenueBase)}</td></tr>
    <tr><td>Total Revenue (with GST)</td><td>₹${formatNumber(totalRevenue)}</td></tr>
    <tr><td>Total Cost (Base)</td><td>₹${formatNumber(totalCostsExclGST)}</td></tr>
    <tr style="background: #e8f5e9;"><td><b>Gross Profit</b> (Revenue - Cost)</td><td style="color: ${grossProfit >= 0 ? 'green' : 'red'}; font-weight: bold;">₹${formatNumber(grossProfit)}</td></tr>
    <tr><td>Gross Profit per Sleeper</td><td>₹${formatNumber(grossProfitPerSleeper)}</td></tr>
    ${!isSellingWithGST ? `<tr style="background: #ffebee;"><td>Input GST Lost (No ITC)</td><td style="color: red;">- ₹${formatNumber(inputGST)}</td></tr>` : ''}
    ${!isSellingWithGST ? `<tr style="background: #fff3e0;"><td><b>Net Profit</b></td><td style="color: ${netProfit >= 0 ? 'green' : 'red'}; font-weight: bold;">₹${formatNumber(netProfit)}</td></tr>` : ''}
    ${!isSellingWithGST ? `<tr><td>Net Profit per Sleeper</td><td>₹${formatNumber(netProfitPerSleeper)}</td></tr>` : ''}
    <tr><td>Profit Margin %</td><td style="color: ${profitMarginPercent >= 0 ? 'green' : 'red'}; font-weight: bold;">${profitMarginPercent.toFixed(2)}%</td></tr>
    </table>
    </div>

    <h3>💰 GST Details</h3>
    <div class="table-container">
    <table>
    <tr style="background: #e3f2fd;"><td>Input GST (on Purchase)</td><td>₹${formatNumber(inputGST)}</td></tr>
    <tr style="background: #e3f2fd;"><td>Output GST (Steel Wire)</td><td>₹${formatNumber(steelWireRevenueGST)}</td></tr>
    <tr style="background: #fff3e0;"><td>Output GST (MS Scrap)</td><td>₹${formatNumber(msScrapRevenueGST)}</td></tr>
    <tr style="background: ${netGSTPayable >= 0 ? '#fffde7' : '#e8f5e9'};"><td><b>${netGSTPayable >= 0 ? 'Net GST Payable to Govt' : 'GST Refund Claimable'}</b></td><td style="color: ${netGSTPayable >= 0 ? '#333' : '#2e7d32'}; font-weight: bold;">${netGSTPayable >= 0 ? '₹' + formatNumber(netGSTPayable) : '₹' + formatNumber(Math.abs(netGSTPayable)) + ' (Refund)'}</td></tr>
    ${netGSTPayable < 0 ? `<tr><td colspan="2" style="font-size: 0.85rem; color: #2e7d32;">✓ Input GST exceeds Output GST - You can claim ₹${formatNumber(Math.abs(netGSTPayable))} as GST refund</td></tr>` : ''}
    ${isSellingWithGST ? `<tr><td colspan="2" style="font-size: 0.85rem; color: #666;">✓ Input GST is claimable as ITC since you are selling with GST</td></tr>` : `<tr><td colspan="2" style="font-size: 0.85rem; color: #c62828;">⚠ Input GST of ₹${formatNumber(inputGST)} is lost since you are NOT selling with GST</td></tr>`}
    </table>
    </div>
    `;

                calcBtn.classList.remove('loading');
                calcBtn.textContent = '📊 Calculate';

                // Smooth scroll to results
                document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }

        // Export Excel
        function exportExcel() {
            if (!lastCalculation.purchaseBase) {
                alert("Please Calculate first!");
                return;
            }

            try {
                let qty = lastCalculation.qty;
                let ws_data = [
                    ["Sleeper Business Profit Analysis Report"],
                    ["Generated on: " + new Date().toLocaleDateString()],
                    [],
                    ["COST BREAKDOWN"],
                    ["Item", "Total (₹)", "Per Sleeper (₹)"],
                    ["Purchase Base", lastCalculation.purchaseBase, lastCalculation.purchaseBase / qty],
                    ["Input GST (Purchase)", lastCalculation.inputGST, lastCalculation.inputGST / qty],
                    ["Labour Cost", lastCalculation.labourCost, lastCalculation.labourCost / qty],
                    ["Transportation", lastCalculation.transport, lastCalculation.transport / qty],
                    ["Land Lease", lastCalculation.landLease, lastCalculation.landLease / qty],
                    ["Other Fixed Expenses", lastCalculation.others, lastCalculation.others / qty],
                    ["Total Cost (excl. GST)", lastCalculation.totalCostsExclGST, lastCalculation.perSleeperCost],
                    [],
                    ["STEEL WIRE REVENUE"],
                    ["Total Weight (kg)", lastCalculation.totalSteelWireWeight, "-"],
                    ["Base Price Revenue", lastCalculation.steelWireRevenueBase, lastCalculation.steelWirePrice],
                    ["GST Applied (18%)", lastCalculation.steelWireGSTEnabled ? "Yes" : "No", lastCalculation.steelWireRevenueGST],
                    [],
                    ["MS SCRAP REVENUE"],
                    ["Total Weight (kg)", lastCalculation.totalMsScrapWeight, "-"],
                    ["Base Price Revenue", lastCalculation.msScrapRevenueBase, lastCalculation.msScrapPrice],
                    ["GST Applied (18%)", lastCalculation.msScrapGSTEnabled ? "Yes" : "No", lastCalculation.msScrapRevenueGST],
                    [],
                    ["PROFIT & GST SUMMARY"],
                    ["Total Revenue (Base)", lastCalculation.totalRevenueBase, "-"],
                    ["Total Revenue (with GST)", lastCalculation.totalRevenue, "-"],
                    ["Gross Profit", lastCalculation.grossProfit, lastCalculation.grossProfitPerSleeper],
                    ["Input GST Lost (if not selling with GST)", lastCalculation.unclaimableInputGST, "-"],
                    ["Net Profit", lastCalculation.netProfit, lastCalculation.netProfitPerSleeper],
                    ["Profit Margin %", lastCalculation.profitMarginPercent.toFixed(2) + "%", "-"],
                    [],
                    ["GST DETAILS"],
                    ["Input GST (on Purchase)", lastCalculation.inputGST, "-"],
                    ["Output GST (Steel Wire)", lastCalculation.steelWireRevenueGST, "-"],
                    ["Output GST (MS Scrap)", lastCalculation.msScrapRevenueGST, "-"],
                    ["Net GST Payable to Govt", lastCalculation.netGSTPayable, "-"],
                    ["ITC Claimable?", lastCalculation.isSellingWithGST ? "Yes" : "No", "-"]
                ];
                let wb = XLSX.utils.book_new();
                let ws = XLSX.utils.aoa_to_sheet(ws_data);

                // Auto-fit column widths
                const range = XLSX.utils.decode_range(ws['!ref']);
                const wscols = [];
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    let max_width = 0;
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        const cell_address = XLSX.utils.encode_cell({ c: C, r: R });
                        if (!ws[cell_address]) continue;
                        const cell_text = ws[cell_address].v ? ws[cell_address].v.toString() : '';
                        max_width = Math.max(max_width, cell_text.length);
                    }
                    wscols.push({ width: Math.min(max_width + 2, 50) });
                }
                ws['!cols'] = wscols;

                XLSX.utils.book_append_sheet(wb, ws, "Profit Analysis");
                XLSX.writeFile(wb, "Sleeper_Profit_Report_" + new Date().toISOString().split('T')[0] + ".xlsx");
            } catch (error) {
                alert("Error exporting Excel file. Please try again.");
                console.error(error);
            }
        }

        // Export PDF
        function exportPDF() {
            if (!lastCalculation.purchaseBase) {
                alert("Please Calculate first!");
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                let y = 20;

                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text("Sleeper Business Profit Analysis Report", 20, y);
                y += 15;

                doc.setFontSize(10);
                doc.setFont(undefined, 'normal');
                doc.text("Generated on: " + new Date().toLocaleDateString(), 20, y);
                y += 10;

                // Add summary
                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                doc.text("Summary:", 20, y);
                y += 8;
                doc.setFont(undefined, 'normal');
                doc.text(`Quantity: ${formatNumber(lastCalculation.qty)} Sleepers`, 20, y);
                y += 6;
                doc.text(`Total Revenue: Rs.${formatNumber(lastCalculation.totalRevenue)}`, 20, y);
                y += 6;
                doc.text(`Profit (excl. GST): Rs.${formatNumber(lastCalculation.profit)}`, 20, y);
                y += 6;
                doc.text(`Net Profit After GST: Rs.${formatNumber(lastCalculation.netProfitAfterGST)}`, 20, y);
                y += 10;

                doc.setFontSize(12);
                const reportData = [
                    ["Cost Analysis", ""],
                    ["Purchase Base", "Rs." + formatNumber(lastCalculation.purchaseBase)],
                    ["Input GST (Purchase)", "Rs." + formatNumber(lastCalculation.inputGST)],
                    ["Labour Cost", "Rs." + formatNumber(lastCalculation.labourCost)],
                    ["Transportation", "Rs." + formatNumber(lastCalculation.transport)],
                    ["Land Lease", "Rs." + formatNumber(lastCalculation.landLease)],
                    ["Other Expenses", "Rs." + formatNumber(lastCalculation.others)],
                    ["Total Cost (excl. GST)", "Rs." + formatNumber(lastCalculation.totalCostsExclGST)],
                    ["", ""],
                    ["Steel Wire Revenue", ""],
                    ["Total Weight", formatNumber(lastCalculation.totalSteelWireWeight) + " kg"],
                    ["Base Price Revenue", "Rs." + formatNumber(lastCalculation.steelWireRevenueBase)],
                    ["GST Applied (18%)", lastCalculation.steelWireGSTEnabled ? "Yes - Rs." + formatNumber(lastCalculation.steelWireRevenueGST) : "No"],
                    ["", ""],
                    ["MS Scrap Revenue", ""],
                    ["Total Weight", formatNumber(lastCalculation.totalMsScrapWeight) + " kg"],
                    ["Base Price Revenue", "Rs." + formatNumber(lastCalculation.msScrapRevenueBase)],
                    ["GST Applied (18%)", lastCalculation.msScrapGSTEnabled ? "Yes - Rs." + formatNumber(lastCalculation.msScrapRevenueGST) : "No"],
                    ["", ""],
                    ["Profit Summary", ""],
                    ["Total Revenue (Base)", "Rs." + formatNumber(lastCalculation.totalRevenueBase)],
                    ["Total Revenue (with GST)", "Rs." + formatNumber(lastCalculation.totalRevenue)],
                    ["Gross Profit", "Rs." + formatNumber(lastCalculation.grossProfit)],
                    ["Gross Profit per Sleeper", "Rs." + formatNumber(lastCalculation.grossProfitPerSleeper)],
                    ["Input GST Lost (if any)", "Rs." + formatNumber(lastCalculation.unclaimableInputGST)],
                    ["Net Profit", "Rs." + formatNumber(lastCalculation.netProfit)],
                    ["Net Profit per Sleeper", "Rs." + formatNumber(lastCalculation.netProfitPerSleeper)],
                    ["Profit Margin", lastCalculation.profitMarginPercent.toFixed(2) + "%"],
                    ["", ""],
                    ["GST Summary", ""],
                    ["Input GST (on Purchase)", "Rs." + formatNumber(lastCalculation.inputGST)],
                    ["Output GST (Steel Wire)", "Rs." + formatNumber(lastCalculation.steelWireRevenueGST)],
                    ["Output GST (MS Scrap)", "Rs." + formatNumber(lastCalculation.msScrapRevenueGST)],
                    ["Net GST Payable to Govt", "Rs." + formatNumber(lastCalculation.netGSTPayable)],
                    ["ITC Claimable?", lastCalculation.isSellingWithGST ? "Yes" : "No"]
                ];

                reportData.forEach(([key, val]) => {
                    if (key === "" && val === "") {
                        y += 5;
                        return;
                    }
                    if (val === "") {
                        doc.setFont(undefined, 'bold');
                        doc.text(key, 20, y);
                        doc.setFont(undefined, 'normal');
                    } else {
                        doc.text(`${key}: ${val}`, 20, y);
                    }
                    y += 7;

                    // Add new page if needed
                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                    }
                });

                doc.save("Sleeper_Profit_Report_" + new Date().toISOString().split('T')[0] + ".pdf");
            } catch (error) {
                alert("Error exporting PDF file. Please try again.");
                console.error(error);
            }
        }

        // Auto-calculate on input change (debounced)
        let debounceTimer;
        let autoCalcEnabled = false;

        function debounceCalculate() {
            if (!autoCalcEnabled) return;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (document.getElementById('quantity').value && document.getElementById('auctionPrice').value) {
                    calculateProfit();
                }
            }, 1000);
        }

        function toggleAutoCalc() {
            autoCalcEnabled = document.getElementById('autoCalcToggle').checked;
            if (autoCalcEnabled) {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.addEventListener('input', debounceCalculate);
                });
            } else {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.removeEventListener('input', debounceCalculate);
                });
            }
        }

        // Prevent form submission on Enter key
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculateProfit();
            }
        });
    </script>
</body>
